# Base de datos PostgreSQL para SalatiaCoffee
# Uso: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: salatiacoffee-db
    environment:
      POSTGRES_USER: salatia
      POSTGRES_PASSWORD: salatia_dev
      POSTGRES_DB: salatiacoffee
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/migracion_01_sesion_chat.sql:/docker-entrypoint-initdb.d/03-migracion_01_sesion_chat.sql:ro
volumes:
  pgdata:
