<form class="card flex flex-col gap-5 p-7" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h2 class="title-2">{{ product() ? 'Editar producto' : 'Nuevo producto' }}</h2>

  @if (error()) {
    <app-alert>{{ error() }}</app-alert>
  }

  <div class="grid gap-5 [grid-template-columns:repeat(auto-fill,minmax(240px,1fr))]">
    <div>
      <label class="field-label" for="nombre">Nombre</label>
      <input
        id="nombre"
        class="input"
        [class.input-invalid]="invalid('nombre')"
        formControlName="nombre"
        type="text"
        maxlength="120"
        [attr.aria-invalid]="invalid('nombre')"
      />
      @if (invalid('nombre')) {
        <p class="field-error"><app-icon name="alert" /> Escribe el nombre del producto.</p>
      }
    </div>

    <div>
      <label class="field-label" for="precio">Precio (COP)</label>
      <input
        id="precio"
        class="input"
        [class.input-invalid]="invalid('precio')"
        formControlName="precio"
        type="number"
        min="0"
        step="100"
        inputmode="numeric"
        [attr.aria-invalid]="invalid('precio')"
      />
      @if (invalid('precio')) {
        <p class="field-error"><app-icon name="alert" /> Escribe un precio igual o mayor a 0.</p>
      }
    </div>

    <div>
      <label class="field-label" for="categoria">Categoría</label>
      <select
        id="categoria"
        class="input"
        [class.input-invalid]="invalid('id_categoria')"
        formControlName="id_categoria"
        [attr.aria-invalid]="invalid('id_categoria')"
      >
        <option [ngValue]="0" disabled>Elige una categoría</option>
        @for (category of categories(); track category.id) {
          <option [ngValue]="category.id">{{ category.nombre }}</option>
        }
      </select>
      @if (invalid('id_categoria')) {
        <p class="field-error"><app-icon name="alert" /> Elige una categoría.</p>
      }
    </div>
  </div>

  <div>
    <label class="field-label" for="descripcion">Descripción (opcional)</label>
    <textarea id="descripcion" class="input py-2.5" rows="2" maxlength="500" formControlName="descripcion"></textarea>
  </div>

  <label class="flex min-h-[44px] items-center gap-3 font-semibold">
    <input class="size-[22px] accent-olive" type="checkbox" formControlName="disponible" />
    Disponible para pedir
  </label>

  <div class="flex flex-wrap gap-3">
    <button class="btn btn-primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : 'Guardar producto' }}
    </button>
    <button class="btn btn-secondary" type="button" (click)="cancelled.emit()">Cancelar</button>
  </div>
</form>
